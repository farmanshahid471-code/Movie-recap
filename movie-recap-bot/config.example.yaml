# Movie Recap Bot — configuration template (copy to config.yaml and adjust;
# values match the shipped defaults in recap/config.py).
project:
  name: "recap"            # used to name output files: <name>_<lang>.mp4
  # Where final videos + _work intermediates go. Absolute paths are fine and
  # recommended so nothing is written to the C: drive, e.g. "D:\\recap\\output"
  # (a relative path resolves against this bot folder). Env override: OUTPUT_DIR
  output_dir: "output"
  # Where model weights / ffmpeg binaries / scratch go. Leave "" (default) and
  # the cache lives next to output_dir (same drive). Env override: CACHE_DIR
  cache_dir: ""

language:
  # en = English (master). zh = Simplified Chinese (line-aligned translation).
  # Add languages by wiring them in recap/pipeline.py::_resolve_narration_lines.
  target_languages: ["en"]
  zh_variant: "zh-CN"

narration:
  # Full-length recap style (~10-16 min of speech at ~150 wpm).
  words_target: 2250       # 900s at 150 wpm; --seconds/--minutes overrides it
  words_min: 600
  words_max: 6000
  words_per_minute: 150    # speech rate used for every length calculation
  lang_voice:
    en: "en-US-ChristopherNeural"
    zh: "zh-CN-YunxiNeural"
  tts_provider: "edge"     # edge | elevenlabs | openai
  rate: "+0%"

# Step A1-A2 — Whisper ASR tuning (used when no .srt sits next to the movie).
dialogue:
  whisper_model: "small"   # tiny/base/small/medium/large-v3
  whisper_device: "auto"   # auto | cpu | cuda
  whisper_language: null   # e.g. "en"; null = auto-detect
  word_timestamps: true    # per-word times in transcript.json
  max_chars: null

# Step A3 — contextual chunking (LLM context windows never overflow).
chunking:
  window_seconds: 300      # 5-minute logical blocks
  overlap_seconds: 30      # 30s of carry between blocks
  parallel: false          # true parallelizes chunk summaries (remote LLMs)
  # Optional: a smaller/faster model for the chunk-summary pass (the slowest
  # LLM step on CPU-only PCs). e.g. "qwen2.5:3b" ~4x faster than qwen2.5 7B.
  model: null

# Step D — chronological timeline (recap line -> film moment, in order).
# Beats advance monotonically through the film and each beat's visual length is
# locked to its narration cue, so the video can never drift or be truncated.
timeline:
  micro_cut_seconds: 3.0   # aim for a new shot roughly every 3 seconds
  max_cuts_per_beat: 3     # one sentence becomes up to 3 micro-shots
  min_cut_seconds: 1.2     # never flash a shot shorter than this
  pre_roll: 0.4            # start each shot slightly before its moment

# (legacy) semantic vector matching — no longer used for beat selection.
semantic:
  enabled: true
  embedding_model: "all-MiniLM-L6-v2"   # local, 384-dim
  # vector store: auto | local | supabase
  #   auto      -> Supabase when SUPABASE_URL + SUPABASE_SERVICE_KEY (or
  #                SUPABASE_DB_URL) are set in .env, else a local SQLite store.
  #   supabase  -> hosted Postgres + pgvector (apply migrations/001_pgvector.sql
  #                once in the Supabase SQL editor).
  store: "auto"
  top_k: 3                 # candidates considered per line (de-duplicated)
  min_score: 0.10          # below this the line falls back to even spacing
  pre_roll: 0.5            # seconds of footage shown before the matched cue
  clip_pad: 0.15           # extra footage after each narration line
  min_clip: 0.8            # never cut a beat shorter than this
  max_clip: 10.0           # nor longer than this
  clip:
    # reencode is now the default: stream copy snaps each cut to the nearest
    # keyframe and those errors accumulate into seconds of audio/video drift.
    mode: "reencode"

subtitles:
  font: "Noto Serif CJK SC"
  fontsize: 56
  margin_v: 96
  margin_x: 40
  outline: 3
  shadow: 1
  max_combo_duration: 6.0
  line_width_units: 30
  display_lang: "en"

video:
  fps: 30
  width: 1920
  height: 1080
  concat_mode: "fit"
  montage: "scenes"        # legacy engine only; semantic engine cuts real beats
  scene_len: 6.0
  scene_min_len: 2.0
  scene_max_len: 20.0
  scene_threshold: 27.0
  codec: "libx264"
  audio_codec: "aac"
  bgm: ""
  bgm_volume: 0.12

llm:
  # DeepSeek: strong, cheap, reliable JSON mode, and fast enough that the
  # section-by-section script pass finishes in a couple of minutes.
  # Set DEEPSEEK_API_KEY in .env (get one at platform.deepseek.com).
  provider: deepseek
  model: deepseek-chat     # or deepseek-reasoner for harder plots
  base_url: "https://api.deepseek.com/v1"
