# Movie Recap — Recap Studio panel (+ headless CLI container), DeepSeek API.
#
# The recap is written by the DeepSeek API (cloud): set your key in the
# environment before starting, e.g.:
#   export DEEPSEEK_API_KEY=sk-...        (Linux/macOS)
#   set DEEPSEEK_API_KEY=sk-...           (Windows cmd)
#   docker compose up --build
# then open http://localhost:8080 (Recap Studio — set Movie path to /movies/<file>.mp4)
#
# Headless CLI instead:  docker compose run --rm recap auto --movie /movies/my_movie.mp4
#   (the `recap` service runs on demand via the "cli" profile)
#
# Folders:
#   ./movies  -> your owned movies, mounted read-only at /movies
#   ./output  -> rendered mp4s + intermediates
#   ./cache   -> whisper model weights / static-ffmpeg (persisted between runs)
#
# TTS is edge-tts (free Microsoft neural voices); the container needs internet
# to reach both api.deepseek.com and Microsoft's speech servers.

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    container_name: movie-recap-studio
    environment:
      LLM_PROVIDER: deepseek
      MODEL_NAME: deepseek-chat
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in the environment (platform.deepseek.com -> API keys)}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      CACHE_DIR: /cache
      OUTPUT_DIR: /srv/recap-studio/output
    ports:
      - "8080:8080"
    volumes:
      - ./movies:/movies:ro
      - ./output:/srv/recap-studio/output
      # Persist panel settings on the host (container-friendly defaults):
      - ./recap-studio/config.docker.json:/srv/recap-studio/config.json
      - model-cache:/cache

  # Headless CLI runner (used on demand; not started by default):
  recap:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cli"]
    environment:
      LLM_PROVIDER: deepseek
      MODEL_NAME: deepseek-chat
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in the environment (platform.deepseek.com -> API keys)}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      CACHE_DIR: /cache
      OUTPUT_DIR: /app/output
    volumes:
      - ./movies:/movies:ro
      - ./output:/app/output
      - model-cache:/cache
    command: ["--help"]

volumes:
  model-cache:
