# Clip 2 — CHINESE (Mandarin) dubbing + CHINESE burned-in subtitles.
# Narration language = zh -> script generated in Chinese, TTS = zh voice,
# subtitles = original (Chinese, matching the narration).
movie: "Sample Movie"
style: "热血搞笑"
duration: 60
lang: zh                    # narration language
voice: zh-CN-YunxiNeural
video_format: "16:9"
video: "/home/user/samplemovie/sample_movie.mp4"
no_bgm: true

steps:
  research: true
  align: false
  scene: true
  match: true
  bgm: false
  export: false
  translate: false

subtitle_lang: ""           # empty = original subtitles in narration language (zh)
subtitle_mode: original
narration_preset: "mainstream-dry"

params:
  scene_threshold: 27.0
  scene_frame_skip: 6
  scene_merge_min_duration: 2.0
  match_min_score: 0.25
